name: FlexUI iPad host compile check

on:
  push:
    branches:
      - 'flexui/ipad-host-check'
  workflow_dispatch:

jobs:
  ipad-host:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Resolve and list
        working-directory: flexui-ipad-check
        run: |
          xcodebuild -resolvePackageDependencies 2>&1 | tail -30
          xcodebuild -list 2>&1 | tail -30
      - name: Build AppCheck for iOS
        working-directory: flexui-ipad-check
        run: |
          set +e
          xcodebuild build -scheme FlexUIiPadCheck -destination 'generic/platform=iOS' \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -nE "error:|warning:.*(AetherVideoEngine|FlexVideoEngine)" build.log | head -80 || true
          echo "== compiled sources =="
          grep -E "AetherVideoEngine.swift|FlexVideoEngine.swift" build.log | grep -E "SwiftCompile|CompileSwift" | cut -c1-160 | head -6 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || true
          if [ $status -ne 0 ]; then tail -80 build.log; fi
          exit $status
      - name: Prove the engine framework binds FFmpeg to AetherLib*
        working-directory: flexui-ipad-check
        run: |
          fw=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*" -name "AetherEngineDynamic.framework" -type d 2>/dev/null | head -1)
          echo "framework: $fw"
          bin="$fw/AetherEngineDynamic"
          [ -f "$bin" ] || { echo "ERROR: dynamic framework binary not found"; find ~/Library/Developer/Xcode/DerivedData -name "*.framework" -maxdepth 8 | head -30; exit 1; }
          file "$bin"
          nm -m "$bin" | grep -E " _(avcodec_find_decoder|avcodec_open2|avformat_open_input|swr_alloc_set_opts2)$" || true
          otool -L "$bin" | grep -iE "Aether|VLC" || true
          bad=$(nm -m "$bin" | grep -E "\(undefined\) external _(av|sws|swr)" | grep -v "from AetherLib" | head -5)
          [ -z "$bad" ] || { echo "ERROR: FFmpeg symbols not bound to AetherLib*:"; echo "$bad"; exit 1; }
          echo "OK: every undefined av/sws/swr symbol resolves from AetherLib*"

