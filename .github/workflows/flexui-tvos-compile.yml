name: FlexUI tvOS compile check

# Compile-verifies the FlexUI live-audio-DSP changes against the tvOS SDK.
#
# WHY THIS EXISTS: FlexUI's own Apple builds run on Codemagic and are BILLED. Discovering a Swift
# compile error there wastes a paid build. This runs on GitHub's macOS runners, which are free for
# public repositories, so the fork can be proven to compile before any FlexUI tag is pushed.

on:
  push:
    branches:
      - 'flexui/**'
  pull_request:
  workflow_dispatch:

jobs:
  tvos-build:
    # MUST be a runner whose Xcode ships a tvOS 26+ SDK. VTCapabilityProbe.swift guards
    # VTRegisterSupplementalVideoDecoderIfAvailable behind `#available(tvOS 26.2, ...)`; on an older
    # SDK that symbol is macOS-only and the guard itself fails to compile. Codemagic uses
    # `xcode: latest`, so matching that here is also what keeps this check representative.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i appletv || true

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme AetherEngine -destination 'generic/platform=tvOS'

      - name: Build AetherEngine for tvOS
        run: |
          # Capture the whole log, then surface diagnostics explicitly. Piping straight to `tail`
          # truncated the actual `error:` lines and left only "BUILD FAILED", which is useless.
          set +e
          xcodebuild build \
            -scheme AetherEngine \
            -destination 'generic/platform=tvOS' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          echo "::group::Diagnostics"
          grep -nE "error:|warning:.*(Sendable|actor|concurrency)" build.log | head -60 || true
          echo "::endgroup::"
          if [ $status -ne 0 ]; then
            echo "::group::Tail"
            tail -120 build.log
            echo "::endgroup::"
          fi
          exit $status
